[project]
name = "cnn-multilabel-classification"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "imagehash>=4.3.2",
    "iterative-stratification>=0.1.9",
    "lightning>=2.6.6",
    "mlflow>=3.17.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "timm>=1.0.30",
    "torchmetrics>=1.9.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
]
